<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabs com api</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="abrirTab(0)">Cadastro do cliente</button>
        <button class="tab-btn" onclick="abrirTab(1)">Média</button>
    </div>

    <a id = logout class="logout-link" onclick="logout()">Logout</a>
       
    <div class="tab-content active">
        <h2>clientes cadastrados</h2>
     
        <div class="search-container">
            <input type="text" id="searchInput">
            <button onclick="searchClient()">Pesquisar</button>
            <button onclick="listarClientes()" style="background: #6c757d;">Limpar</button>
        </div>
        <div id="listarClientes" class="client-list"></div>
        </div>

    <div class="tab-content">
        <h2>Cadastro do cliente</h2>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <input type="number" id="cpf" placeholder="Digite seu cpf">
        <input type="number" id="cep" placeholder="Digite seu cep" onblur="buscarEndereco()"> 
        <input type="text" id="rua" placeholder="Rua">
        <input type="text" id="cidade" placeholder="Cidade">
        <input type="text" id="estado" placeholder="Estado">
        <input type="number" id="numero" placeholder="Número">
        <button onclick="cadastrarCliente()">Cadastrar cliente</button>

    </div>


        <script src="index.js"></script>
   
</body>
</html>
