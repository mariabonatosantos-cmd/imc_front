<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabs com api</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            background: #f4f4f4 ;
        }
        .tabs{
            display: flex;
            margin-bottom: 10px;
        }
        .tab-btn{
            flex: 1;
            padding: 15px;
            cursor: pointer;
            border: none;
            background: #ddd;
            font-size: 16;
        }
        .tab-btn.active{
            background: #007bff;
            color: white;
        }
        .tab-content{
            display: none;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .tab-content.tab-btn.active{
            display: block;
        }
        input{
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        button{
            padding: 8px;
            background: #28a745;
            color: white;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .resultado{
            margin-top: 15px;
            padding: 15px;
            background: #eee;
            border-radius: 5px;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="abrirTab(0)">IMC</button>
        <button class="tab-btn" onclick="abrirTab(1)">Média</button>
    </div>

    <div class="tab-content active">
        <h2>Calcular IMC</h2>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <input type="number" id="idade" placeholder="Digite sua idade">
        <input type="number" id="altura" placeholder="Digite sua altura">
        <input type="number" id="peso" placeholder="Digite seu peso">
        <button onclick="calcularImc()">Calcular IMC</button>
        <div class="resultado" id="resultadoImc"></div>
    </div>
    <script>
        function abrirTab(index){
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.querySelectorAll('tab-content')[index].classList.add('active');
            document.QuerySelectorAll('.tab-btn')[index].classList.add('active');
        }
        async function calcularImc(){
            const dados = {
                nome: document.getElementById("nome").value,
                idade: document.getElementById("idade").value,
                altura: document.getElementById("altura").value,
                peso: document.getElementById("peso").value
            }

            try {
                const response = await fetch("http://localhost:3000/imc", {
                    method: "POST", 
                    headers: {
                        "content-type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });
                const resultado = await response.json();
                document.getElementById("resultadoImc").innerHTML = formatarResposta(resultado);
            } catch (error) {
             document.getElementById("resultadoImc").innerHTML = formatarResposta({
                erro: "Ocorreu um erro inesperado. Por favor tente novamente mais tarde."
             });   
            }
        }
    </script>
</body>
</html>
